<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KIMOJA – ELITE Group</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
  <h1>KIMOJA – ELITE GROUP</h1>
  <p>Fair Work • Fair Pay • Transparency</p>
</header>

<section class="cycle">
  <h2>Current Pay Cycle</h2>
  <select id="cycle">
    <option>Sat – Tue (Pay Wed)</option>
    <option>Wed – Fri (Pay Sat)</option>
  </select>
</section>

<section class="filters">
  <h2>Filters & Search</h2>
  <label>
    From: <input type="date" id="filterFrom">
  </label>
  <label>
    To: <input type="date" id="filterTo">
  </label>
  <label>
    Worker:
    <select id="filterWorker"><option value="">All</option></select>
  </label>
  <button onclick="applyFilters()">Apply</button>
  <button onclick="resetFilters()">Reset</button>
</section>

<section class="truck-entry">
  <h2>Add Truck</h2>
  <input type="text" id="plate" placeholder="Number Plate">
  <input type="number" id="amount" placeholder="Truck Amount">
  <button onclick="addTruck()">Add Truck</button>
</section>

<section class="table-section">
  <h2>Attendance & Distribution</h2>
  <table id="workTable"></table>
</section>

<section class="totals">
  <h2>Totals</h2>
  <div id="totalsOutput"></div>
</section>

<section class="charts">
  <h2>Charts 📊</h2>
  <canvas id="dailyChart"></canvas>
  <canvas id="cumulativeChart"></canvas>
</section>

<section class="payment-history">
  <h2>Payment History 💼</h2>
  <div id="paymentHistoryContainer"></div>
  <button onclick="toggleHistory()">Show/Hide History</button>
</section>

<section class="payslip">
  <h2>Payslip & Export</h2>
  <label>Worker:
    <select id="workerSelect"></select>
  </label>
  <label>From: <input type="date" id="fromDate"></label>
  <label>To: <input type="date" id="toDate"></label>
  <button onclick="generatePayslip()">Generate</button>
  <button onclick="exportPayslipCSV()">Export CSV</button>
  <button onclick="downloadPayslipPDF()">Download PDF</button>
  <div id="payslipOutput"></div>
</section>

<section class="finance">
  <h2>Money Wisdom 💰</h2>
  <p id="financeTip"></p>
  <a href="https://www.cma.or.ke" target="_blank">Learn More</a>
</section>

<footer>
  <button onclick="closePayCycle()">Close Pay Cycle & Reset</button>
</footer>

<script src="script.js"></script>
</body>
</html>
